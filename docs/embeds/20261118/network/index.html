<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking Access to Elderly Centres in Hong Kong</title>
<link rel="stylesheet" href="../../../vendor/leaflet.css">
<script src="../../../vendor/leaflet.js"></script>
<style>
body{margin:0;background:white;color:#304c52;font:18px/1.6 Georgia,serif}

*{box-sizing:border-box}main{height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr);font:14px/1.5 Arial,sans-serif}
.explorer-controls{padding:16px 14px;overflow:auto;border-right:1px solid #e0e6e3;color:#172d29;background:white}
.controls label,.controls legend{display:block;font-size:11px;font-weight:600;margin:10px 0 3px}
.controls button,.controls input,.controls select{font:inherit;font-size:12px;color:#172d29;padding:6px;border:1px solid #e0e6e3;border-radius:5px;background:white;max-width:100%}
.controls select{width:100%}.controls fieldset{border:0;padding:0;margin:0;display:flex;gap:4px}.controls button[aria-pressed=true]{background:#ded5eb;border-color:#baa8ce}
.controls #reset-view{margin-top:8px}.controls input{width:68px}.controls [hidden]{display:none}
#results{display:block;border-block:1px solid #e0e6e3;padding:10px 0;margin:10px 0;font-size:12px}
.case-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.case-shortcuts h2{grid-column:1/-1;font:600 11px/1.5 Arial,sans-serif;margin:4px 0;padding:0;border:0;text-transform:uppercase}
.map-stack,[data-panel]{height:100%;min-width:0;min-height:0}.map{height:100%!important}.map .leaflet-popup-content{max-height:200px;overflow:auto}
@media(max-width:620px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,180px) minmax(0,1fr)}
.explorer-controls{padding:8px 12px;border-right:0;border-bottom:1px solid #e0e6e3}
.controls{display:flex;align-items:end;gap:6px;flex-wrap:wrap}.controls #network-view{width:auto;max-width:190px}#results{margin:4px 0;padding:4px 0}}

h1,h2,h3,h4,summary,button{font-family:Arial,sans-serif;color:#062e30}
h1{font-size:clamp(34px,7vw,62px);line-height:1.1;margin-block:0 20px}
h2{margin-block:64px 18px;padding-top:16px;border-top:1px solid #dce5e3}
h4{margin:8px 0}.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.map{height:360px;display:grid;place-items:center;background:#e1eff6}.map.leaflet-container{background:#e1eff6}
.map-legend{font:12px/1.4 Arial,sans-serif;background:white;padding:9px 12px;max-height:135px;max-width:min(230px,65vw);overflow:auto;box-shadow:0 2px 8px #0003}
.map-legend details+details{margin-top:6px}.map-legend span{display:flex;align-items:center;gap:7px;margin:4px 0}
.map-legend i{display:inline-block;width:15px;height:12px;flex:none}
.map-layers{background:white;padding:6px 10px;border-radius:4px;box-shadow:0 2px 8px #0003;max-width:65vw}
.map-layers label{display:flex;align-items:baseline;gap:6px;padding:3px 0}
.context-tiles{filter:sepia(.65) hue-rotate(155deg) saturate(.7) brightness(1.03)}
button{padding:10px 16px;background:#fff;border:1px solid #a6c2bc;border-radius:4px;cursor:pointer}
.workflow details{padding:12px 16px;border-left:4px solid #087b82;background:#eef6f3;margin:8px 0}
summary{cursor:pointer;font-weight:bold}.workflow p{margin:8px 0 0}
a{color:#106c79}.status{padding:12px}
</style>
</head>
<body>
<main>
<aside class="explorer-controls" aria-label="Map controls"><div class="controls"><label for="network-view">View</label> <select id="network-view"><option value="05_priority">A revised shortlist for local service review</option><option value="03_network">Gap along the 3D pedestrian network</option><option value="02_euclidean">The straight-line baseline</option><option value="06_uncertainty">Where the model cannot classify access confidently</option><option value="08_case755">Local case 755</option><option value="09_case231">Local case 231</option><option value="10_case141">Local case 141</option><option value="15_case755_overlap">Sha Kok and Pok Hong: overlapping versus additional reach</option><option value="14_case920_venue">Cheung Chau Community Hall: modelled additional reach</option></select><button id="reset-view">Reset view</button><form id="find-area" class="controls" aria-label="Find a census group"><label>STPUG <input id="area-code" size="5" placeholder="755" required></label><button>Find</button></form></div><div id="screening-controls" class="controls"><fieldset><legend>Distance threshold</legend><button data-distance="500" aria-pressed="false">500 m</button><button data-distance="800" aria-pressed="true">800 m</button><button data-distance="1000" aria-pressed="false">1,000 m</button></fieldset><label>Age 65+ <select id="age-cut"><option>18</option><option selected>20</option><option>22</option></select>%</label><label>Gap <select id="gap-cut"><option>20</option><option selected>30</option><option>40</option></select>%</label></div><output id="results" aria-live="polite"></output><div class="controls case-shortcuts"><h2>Route cases</h2><button data-case="08_case755">Sha Tin</button><button data-case="09_case231">Kowloon City</button><button data-case="10_case141">Western District</button></div></aside><div class="map-stack">
<section data-panel="05_priority"><div class="map" data-key="05_priority"><button>Load map</button></div></section>
<section data-panel="03_network" hidden><div class="map" data-key="03_network"><button>Load map</button></div></section>
<section data-panel="02_euclidean" hidden><div class="map" data-key="02_euclidean"><button>Load map</button></div></section>
<section data-panel="06_uncertainty" hidden><div class="map" data-key="06_uncertainty"><button>Load map</button></div></section>
<section data-panel="08_case755" hidden><div class="map" data-key="08_case755"><button>Load map</button></div></section>
<section data-panel="09_case231" hidden><div class="map" data-key="09_case231"><button>Load map</button></div></section>
<section data-panel="10_case141" hidden><div class="map" data-key="10_case141"><button>Load map</button></div></section>
<section data-panel="15_case755_overlap" hidden><div class="map" data-key="15_case755_overlap"><button>Load map</button></div></section>
<section data-panel="14_case920_venue" hidden><div class="map" data-key="14_case920_venue"><button>Load map</button></div></section></div>
</main>
<script>
window.networkMaps = Object.create(null);
const mapLoads = new Map();
function loadMap(key) {
  if (!mapLoads.has(key)) {
    mapLoads.set(key, new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "webmaps/" + key + ".js" + location.search;
      script.onload = () => resolve(window.networkMaps[key]);
      script.onerror = () => reject(Error("Map data could not be loaded."));
      document.head.append(script);
    }));
  }
  return mapLoads.get(key);
}
function makeLegend(data) {
  const legend = document.createElement("aside");
  legend.className = "map-legend";
  legend.setAttribute("aria-label", "Map legend");
  for (const layer of data.operationalLayers.filter(l => l.visibility && l.showLegend !== false)) {
    const sub = layer.featureCollection.layers[0];
    const r = sub.layerDefinition.drawingInfo.renderer;
    const values = new Set(sub.featureSet.features.map(f => String(f.attributes[r.field1])));
    const entries = r.classBreakInfos || r.uniqueValueInfos?.filter(i => layer.id === 'priority' || values.has(String(i.value))) ||
      [{label: r.label || layer.title, symbol: r.symbol}];
    if (layer.id === "priority" && !entries.some(i => i.value === "Uncertain")) {
      entries.push({value:"Uncertain", label:"Unresolved at the gap cutoff",
                    symbol:{type:"esriSFS",color:[221,189,156,255]}});
    }
    const section = document.createElement("details");
    section.open = !legend.children.length;
    const title = document.createElement("summary");
    title.textContent = layer.title;
    section.append(title);
    const scenarioLabels = {"Priority": "Meets both cutoffs", "Higher ageing, lower gap": "Meets age cutoff only",
      "Lower ageing": "Below age cutoff", "Uncertain": "Unresolved at the gap cutoff", "Not assessed": "No residential cells"};
    if (layer.id === "priority" && r.uniqueValueInfos) {
      for (const entry of r.uniqueValueInfos) entry.label = scenarioLabels[entry.value] || entry.label;
    }
    for (const entry of entries) {
      const row = document.createElement("span"), chip = document.createElement("i");
      const [red,green,blue,alpha] = entry.symbol.color;
      chip.style.backgroundColor = `rgba(${red},${green},${blue},${alpha / 255})`;
      chip.style.clipPath = entry.symbol.style === "esriSMSDiamond" ? "polygon(50% 0,100% 50%,50% 100%,0 50%)" :
        entry.symbol.type === "esriSFS" ? "polygon(0 0,100% 45%,100% 100%,0 100%)" : "none";
      if (entry.symbol.type === "esriSLS") chip.style.height = "3px";
      row.append(chip, document.createTextNode(entry.label));
      section.append(row);
    }
    legend.append(section);
  }
  return legend;
}
for (const frame of document.querySelectorAll(".map")) {
  frame.querySelector("button").addEventListener("click", async () => {
    frame.innerHTML = '<p class="status" role="status">Loading map…</p>';
    try {
      const data = await loadMap(frame.dataset.key);
      frame.replaceChildren();
      frame.style.display = "block";
      const map = L.map(frame, {scrollWheelZoom: false, attributionControl: false});
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        maxZoom:18,maxNativeZoom:16,className:"context-tiles",attribution:"Tiles © Esri, HERE, Garmin"
      }).addTo(map);
      const overlays = {}, areas = new Map();
      L.control.attribution({prefix: false}).addAttribution("HKSAR Government CSDI · GEOG7302 Group 13").addTo(map);
      const latLng = ([x, y], sr) => sr.wkid === 4326 ? L.latLng(y, x) :
        L.CRS.EPSG3857.unproject(L.point(x, y));
      for (const [index, layer] of data.operationalLayers.filter(l => l.visibility).entries()) {
        const group = L.layerGroup().addTo(map), pane = 'data-' + index;
        map.createPane(pane).style.zIndex = 410 + index;
        if (layer.showLegend !== false) overlays[layer.title] = group;
        const {layerDefinition: def, featureSet, popupInfo} = layer.featureCollection.layers[0];
        const r = def.drawingInfo.renderer;
        for (const feature of featureSet.features) {
          const a = feature.attributes, g = feature.geometry, pos = xy => latLng(xy, featureSet.spatialReference);
          const symbol = r.symbol || r.uniqueValueInfos?.find(c => String(c.value) === String(a[r.field1]))?.symbol ||
            r.classBreakInfos?.find(c => a[r.field] != null && a[r.field] <= c.classMaxValue)?.symbol || r.defaultSymbol;
          if (!symbol) continue;
          const rgba = ([red,green,blue,alpha]) => `rgba(${red},${green},${blue},${alpha/255})`;
          const fill = rgba(symbol.color), stroke = symbol.outline?.color ? rgba(symbol.outline.color) : fill;
          const options = {pane, color: stroke, fillColor: fill, fillOpacity: layer.opacity ?? 1,
            weight: symbol.outline?.width ?? symbol.width ?? 1, interactive: !layer.disablePopup,
            dashArray: symbol.style === "esriSLSDash" ? "6 4" : null};
          if (layer.id === "study_land") options.fillOpacity = .18;
          let item;
          if (g.rings) item = L.polygon(g.rings.map(ring => ring.map(pos)), options);
          else if (g.paths) item = L.polyline(g.paths.map(line => line.map(pos)), options);
          else if (g.x != null) {
            const radius = symbol.size || 5;
            if (symbol.style === "esriSMSDiamond") {
              const marker = document.createElement("div");
              marker.style.cssText = `width:100%;height:100%;background:${fill};border:1px solid white;transform:rotate(45deg)`;
              item = L.marker(pos([g.x,g.y]), {pane, icon:L.divIcon({className:"facility-marker",html:marker,iconSize:[radius,radius]})});
            } else item = L.circleMarker(pos([g.x,g.y]), {...options,radius});
          }
          if (!item) continue;
          if (popupInfo && !layer.disablePopup) {
            const popup = document.createElement("div");
            const title = document.createElement("strong");
            title.textContent = popupInfo.title.replace(/\{([^}]+)\}/g, (_, key) => a[key] ?? "");
            popup.append(title);
            for (const f of popupInfo.fieldInfos.filter(f => f.visible && a[f.fieldName] != null)) {
              const row = document.createElement("div");
              row.textContent = `${f.label}: ${a[f.fieldName]}`;
              popup.append(row);
            }
            item.bindPopup(popup);
          }
          if (a.stpug_id && g.rings && !areas.has(a.stpug_id)) {
            areas.set(String(a.stpug_id), {item, attributes: a});
          }
          item.addTo(group);
        }
      }
      const e = data.initialState.viewpoint.targetGeometry;
      const bounds = [latLng([e.xmin,e.ymin],e.spatialReference),latLng([e.xmax,e.ymax],e.spatialReference)];
      map.fitBounds(bounds);
      const legend = L.control({position:"bottomright"});
      legend.onAdd = () => {
        const result = makeLegend({...data, operationalLayers: data.operationalLayers.filter(
          layer => !overlays[layer.title] || map.hasLayer(overlays[layer.title])
        )});
        L.DomEvent.disableClickPropagation(result);
        L.DomEvent.disableScrollPropagation(result);
        return result;
      };
      legend.addTo(map);
      const layerMenu = L.control({position:"topright"});
      layerMenu.onAdd = () => {
        const menu = document.createElement("details"), summary = document.createElement("summary");
        menu.className = "map-layers";
        summary.textContent = "Layers";
        menu.append(summary);
        for (const [title, group] of Object.entries(overlays)) {
          const label = document.createElement("label"), input = document.createElement("input");
          input.type = "checkbox";
          input.checked = map.hasLayer(group);
          input.onchange = () => {
            if (input.checked) group.addTo(map); else group.remove();
            legend.remove(); legend.addTo(map);
          };
          label.append(input, document.createTextNode(title));
          menu.append(label);
        }
        L.DomEvent.disableClickPropagation(menu);
        return menu;
      };
      layerMenu.addTo(map);
      frame.networkMap = map;
      frame.networkAreas = areas;
      frame.resetNetworkView = () => {map.closePopup(); map.fitBounds(bounds);};
      frame.dispatchEvent(new Event("networkready"));
    } catch (error) {
      frame.textContent = error.message || "Map could not be displayed.";
    }
  });
}

const select = document.getElementById("network-view");
const controls = document.getElementById("screening-controls");
const output = document.getElementById("results");
const find = document.getElementById("find-area");
const activeFrame = () => document.querySelector('[data-key="' + select.value + '"]');
const ref = id => document.getElementById(id);
let radius = 800;
function screen() {
  const frame = activeFrame();
  if (select.value !== "05_priority" || !frame.networkAreas) return;
  let selected = 0, uncertain = 0;
  const age = +ref("age-cut").value, gap = +ref("gap-cut").value;
  const colours = {priority:"#9e83b6", uncertain:"#ddbd9c", below:"#f2edf7", ageOnly:"#ddd1e9", unassessed:"#a5adb0"};
  for (const [key, {item, attributes:a}] of frame.networkAreas) {
    const lo = a['net_out'+radius+'_lo'], hi = a['net_out'+radius+'_hi'];
    const state = !a.res_cells || lo == null ? "unassessed" : a.pct65 < age ? "below" :
      lo >= gap ? "priority" : hi >= gap ? "uncertain" : "ageOnly";
    if (state === "priority") selected++;
    if (state === "uncertain") uncertain++;
    item.setStyle({fillColor:colours[state], fillOpacity:.88});
    const popup = document.createElement("div"), title = document.createElement("strong");
    title.textContent = "STPUG " + key + (a.place_en ? " · " + a.place_en : "");
    popup.append(title);
    const pct = n => n == null ? "—" : Number(n).toFixed(2) + "%";
    const lines = ["Residents aged 65+: "+pct(a.pct65), "Straight-line gap: "+pct(a["eu_out"+radius]),
      "Network gap: "+pct(lo)+" to "+pct(hi), "Screening: "+({priority:"Priority", uncertain:"Uncertain", below:"Below age cutoff",
        ageOnly:"Below gap cutoff", unassessed:"No residential cells"})[state]];
    for (const text of lines) { const line = document.createElement("div"); line.textContent = text; popup.append(line); }
    if(item.getPopup()) item.setPopupContent(popup); else item.bindPopup(popup);
  }
  output.textContent = selected + " priority groups · " + uncertain + " uncertain";
}
function showView() {
  controls.hidden = select.value !== "05_priority";
  find.hidden = !["05_priority","03_network","02_euclidean","06_uncertainty"].includes(select.value);
  output.textContent = "";
  for (const panel of document.querySelectorAll("[data-panel]")) {
    panel.hidden = panel.dataset.panel !== select.value;
    if (panel.hidden) continue;
    const frame = panel.querySelector(".map");
    if (frame.networkMap) requestAnimationFrame(() => {frame.networkMap.invalidateSize();screen();});
    else {
      frame.addEventListener("networkready", screen, {once:true});
      frame.querySelector("button")?.click();
    }
  }
}
controls.addEventListener("change", screen);
for (const button of document.querySelectorAll("[data-case]")) {
  button.onclick = () => { select.value = button.dataset.case; showView(); };
}
for (const button of controls.querySelectorAll("[data-distance]")) {
  button.onclick = () => {
    radius = +button.dataset.distance;
    for (const other of controls.querySelectorAll("[data-distance]")) {
      other.setAttribute("aria-pressed", String(other === button));
    }
    screen();
  };
}
ref("reset-view").onclick = () => activeFrame().resetNetworkView?.();
find.onsubmit = event => {
  event.preventDefault();
  const frame = activeFrame(), code = ref("area-code").value.trim().toUpperCase();
  const area = frame.networkAreas?.get(code);
  if (!area) { output.textContent = "Group " + code + " was not found in this view."; return; }
  frame.networkMap.fitBounds(area.item.getBounds(), {padding:[24,32], maxZoom:15});
  area.item.openPopup();
};
select.onchange = showView;
showView();
</script>
</body>
</html>
